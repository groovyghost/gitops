apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data-eng-qas
  namespace: argocd
spec:
  description: Data Engineering project for QAS environment
  sourceRepos:
    - 'https://github.com/my-org/data-eng-gitops.git'
  destinations:
